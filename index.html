<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CogniMesh // Hyper-Realistic Spatial Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Three.js + Post Processing + 3D Force Graph -->
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.160.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://unpkg.com/three@0.160.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://unpkg.com/three@0.160.0/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://unpkg.com/three@0.160.0/examples/js/shaders/CopyShader.js"></script>
  <script src="https://unpkg.com/three@0.160.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
  <script src="https://unpkg.com/three@0.160.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
  <script src="https://unpkg.com/3d-force-graph@1.73.1/dist/3d-force-graph.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #020204; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    #3d-graph { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
    textarea::-webkit-scrollbar { width: 4px; }
    textarea::-webkit-scrollbar-track { background: #000000; }
    textarea::-webkit-scrollbar-thumb { background: #27272a; }
  </style>
</head>
<body class="relative bg-[#020204] select-none" onclick="initAudio()">

  <!-- Header Badge -->
  <div class="absolute top-6 left-1/2 -translate-x-1/2 z-20 flex items-center space-x-3 bg-black/80 border border-white/20 px-6 py-2.5 backdrop-blur-xl shadow-[0_0_20px_rgba(255,255,255,0.1)] rounded-full">
    <div class="w-2.5 h-2.5 bg-white rounded-full animate-ping shadow-[0_0_10px_#ffffff]"></div>
    <span class="text-xs font-bold tracking-widest text-white uppercase font-mono">COGNI-MESH</span>
    <span class="text-zinc-700">|</span>
    <span class="text-[10px] text-zinc-300 tracking-wider font-mono">WHITE MONOCHROME SPATIAL ENGINE</span>
  </div>

  <!-- Left Control Panel -->
  <div class="absolute top-20 left-6 z-20 w-80 bg-black/80 border border-zinc-800/80 p-5 rounded-2xl shadow-[0_0_30px_rgba(0,0,0,0.8)] backdrop-blur-2xl">
    <div class="flex items-center justify-between mb-3 border-b border-zinc-800/80 pb-2">
      <h2 class="text-[11px] font-bold text-zinc-300 uppercase tracking-widest font-mono">PHYSICS & CONTROL</h2>
      <span id="voiceStatus" class="text-[9px] text-zinc-400 font-mono">MIC_READY</span>
    </div>

    <!-- Quick Presets without Emojis -->
    <div class="flex flex-wrap gap-1.5 mb-3">
      <button onclick="setPrompt('E-commerce user order payment and shipping pipeline')" onmouseenter="playBeep(700, 0.02)" class="text-[9px] bg-zinc-900 hover:bg-zinc-800 border border-zinc-700/60 text-zinc-200 px-2 py-1 rounded transition">E-Commerce</button>
      <button onclick="setPrompt('User authentication JWT security database flow')" onmouseenter="playBeep(700, 0.02)" class="text-[9px] bg-zinc-900 hover:bg-zinc-800 border border-zinc-700/60 text-zinc-200 px-2 py-1 rounded transition">Auth Flow</button>
      <button onclick="setPrompt('AI Model training data ingestion feature extraction neural network')" onmouseenter="playBeep(700, 0.02)" class="text-[9px] bg-zinc-900 hover:bg-zinc-800 border border-zinc-700/60 text-zinc-200 px-2 py-1 rounded transition">AI Pipeline</button>
    </div>

    <textarea id="promptInput" rows="4" class="w-full bg-zinc-950/80 border border-zinc-800 text-xs text-zinc-200 p-3 rounded-lg focus:outline-none focus:border-white transition mb-3 resize-none placeholder-zinc-600 font-mono leading-relaxed" placeholder="Write text or press mic to speak..."></textarea>

    <!-- Voice Control Button -->
    <button id="micBtn" onclick="toggleVoiceControl()" onmouseenter="playBeep(600, 0.02)" class="w-full mb-3 bg-zinc-900/80 hover:bg-zinc-800 border border-zinc-700/60 text-zinc-200 text-[11px] py-2 rounded-lg font-mono font-bold flex items-center justify-center space-x-2 transition">
      <span id="micDot" class="w-2 h-2 rounded-full bg-white"></span>
      <span id="micText">START VOICE COMMANDS</span>
    </button>

    <div class="flex space-x-2">
      <button onclick="generateAIFlow(); playWarpSound();" onmouseenter="playBeep(800, 0.03)" class="flex-1 bg-zinc-900 hover:bg-zinc-800 text-white font-bold border border-white/30 hover:border-white text-[11px] py-2.5 rounded-lg tracking-wider uppercase transition-all duration-300 font-mono shadow-[0_0_15px_rgba(255,255,255,0.1)] active:scale-95">
        RENDER FLOW
      </button>
      <button onclick="resetCamera(); playBeep(400, 0.1);" onmouseenter="playBeep(600, 0.03)" class="bg-zinc-900/80 hover:bg-zinc-800 text-zinc-400 hover:text-white border border-zinc-800 text-[11px] px-3 py-2.5 rounded-lg transition font-mono">
        RESET
      </button>
    </div>
  </div>

  <!-- Right Node Detail Drawer -->
  <div id="nodeDetails" class="hidden absolute top-20 right-6 z-20 w-80 bg-black/80 border border-white/20 p-5 rounded-2xl backdrop-blur-2xl shadow-[0_0_20px_rgba(255,255,255,0.1)]">
    <div class="flex justify-between items-center border-b border-zinc-800/80 pb-2 mb-3">
      <div class="flex items-center space-x-2">
        <div class="w-2.5 h-2.5 bg-white rounded-full shadow-[0_0_10px_#ffffff]"></div>
        <h2 id="nodeTitle" class="text-xs font-bold text-white uppercase tracking-wider font-mono"></h2>
      </div>
      <button onclick="closeDetails(); playBeep(300, 0.1);" class="text-zinc-500 hover:text-white text-xs font-mono transition">[ESC]</button>
    </div>
    <p id="nodeDesc" class="text-xs text-zinc-400 leading-relaxed font-mono"></p>
  </div>

  <!-- 3D Graph Container -->
  <div id="3d-graph"></div>

  <script>
    let Graph;
    const animatedRings = [];

    // --- WEB AUDIO SYNTHESIZER ---
    let audioCtx;
    let ambientOsc;
    let dragOsc;
    let dragGain;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        ambientOsc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        ambientOsc.type = 'sine';
        ambientOsc.frequency.setValueAtTime(55, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
        
        ambientOsc.connect(gain);
        gain.connect(audioCtx.destination);
        ambientOsc.start();
      }
    }

    function playBeep(freq = 600, duration = 0.05) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function playWarpSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(100, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.4);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.5);
    }

    function startDragSound() {
      if (!audioCtx) return;
      dragOsc = audioCtx.createOscillator();
      dragGain = audioCtx.createGain();
      dragOsc.type = 'sawtooth';
      dragOsc.frequency.setValueAtTime(300, audioCtx.currentTime);
      dragGain.gain.setValueAtTime(0.03, audioCtx.currentTime);
      dragOsc.connect(dragGain);
      dragGain.connect(audioCtx.destination);
      dragOsc.start();
    }

    function updateDragSound(freq) {
      if (dragOsc && audioCtx) {
        dragOsc.frequency.setValueAtTime(Math.min(1200, Math.max(200, freq)), audioCtx.currentTime);
      }
    }

    function stopDragSound() {
      if (dragOsc && audioCtx) {
        dragGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
        setTimeout(() => { try { dragOsc.stop(); } catch(e){} }, 100);
      }
    }

    function setPrompt(text) {
      document.getElementById('promptInput').value = text;
    }

    const defaultData = {
      nodes: [
        { id: 'PRIMARY_CORE', name: 'PRIMARY_CORE', desc: 'Central Processing & Neural Gateway.', val: 32 },
        { id: 'DATA_STREAM_A', name: 'DATA_STREAM_A', desc: 'High-speed ingestion pipeline.', val: 20 },
        { id: 'EVENT_HORIZON', name: 'EVENT_HORIZON', desc: 'Zero-latency memory boundary.', val: 18 },
        { id: 'QUANTUM_VAULT', name: 'QUANTUM_VAULT', desc: 'Encrypted storage node.', val: 16 }
      ],
      links: [
        { source: 'PRIMARY_CORE', target: 'DATA_STREAM_A' },
        { source: 'PRIMARY_CORE', target: 'EVENT_HORIZON' },
        { source: 'DATA_STREAM_A', target: 'QUANTUM_VAULT' }
      ]
    };

    function startEngine() {
      const elem = document.getElementById('3d-graph');
      if (!elem) return;
      elem.innerHTML = '';

      Graph = ForceGraph3D()(elem)
        .backgroundColor('#020204')
        .graphData(defaultData)
        .nodeLabel('name')

        .d3VelocityDecay(0.3)
        .d3AlphaDecay(0.02)

        .nodeThreeObject(node => {
          const group = new THREE.Group();
          const isCore = node.id.includes('CORE') || node.id.includes('PRIMARY') || node.isRoot;
          const size = isCore ? 12 : Math.max(6, (node.val || 10) / 2.5);

          const geometry = new THREE.SphereGeometry(size, 64, 64);
          const material = new THREE.MeshPhysicalMaterial({
            color: isCore ? 0xffffff : 0xcccccc,
            emissive: isCore ? 0x444444 : 0x222222,
            emissiveIntensity: 1.2,
            roughness: 0.1,
            metalness: 0.8,
            clearcoat: 1.0,
            clearcoatRoughness: 0.1,
            transmission: 0.3,
            transparent: true,
            opacity: 0.95
          });
          const sphere = new THREE.Mesh(geometry, material);
          group.add(sphere);

          const light = new THREE.PointLight(0xffffff, isCore ? 6 : 3, 60);
          group.add(light);

          // White Ring 1
          const ringGeo1 = new THREE.TorusGeometry(size * 1.6, 0.2, 16, 100);
          const ringMat1 = new THREE.MeshBasicMaterial({ color: 0xffffff });
          const ring1 = new THREE.Mesh(ringGeo1, ringMat1);
          ring1.rotation.x = Math.PI / 3;
          group.add(ring1);

          // White Ring 2
          const ringGeo2 = new THREE.TorusGeometry(size * 2.0, 0.15, 16, 100);
          const ringMat2 = new THREE.MeshBasicMaterial({ color: 0xaaaaaa });
          const ring2 = new THREE.Mesh(ringGeo2, ringMat2);
          ring2.rotation.y = Math.PI / 4;
          group.add(ring2);

          animatedRings.push(ring1, ring2);
          return group;
        })

        .linkColor(() => '#ffffff44')
        .linkWidth(2)
        .linkDirectionalParticles(5)
        .linkDirectionalParticleWidth(3.5)
        .linkDirectionalParticleSpeed(0.01)
        .linkDirectionalParticleColor(() => '#ffffff')

        .onNodeDrag((node, translate) => {
          const speed = Math.hypot(translate.x, translate.y, translate.z);
          updateDragSound(300 + speed * 15);
        })
        .onNodeDragEnd(node => {
          stopDragSound();
          playBeep(400, 0.1);
          node.fx = null;
          node.fy = null;
          node.fz = null;
        })

        .onNodeClick(node => {
          playBeep(900, 0.15);
          document.getElementById('nodeDetails').classList.remove('hidden');
          document.getElementById('nodeTitle').innerText = node.name;
          document.getElementById('nodeDesc').innerText = node.desc || 'System entity active in memory.';
          
          const distance = 60;
          const distRatio = 1 + distance/Math.hypot(node.x, node.y, node.z);
          Graph.cameraPosition(
            { x: node.x * distRatio, y: node.y * distRatio, z: node.z * distRatio },
            node,
            1200
          );
        });

      const scene = Graph.scene();

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
      scene.add(ambientLight);

      const dirLight1 = new THREE.DirectionalLight(0xffffff, 2.0);
      dirLight1.position.set(200, 300, 200);
      scene.add(dirLight1);

      const starsGeo = new THREE.BufferGeometry();
      const starsCount = 3000;
      const starPos = new Float32Array(starsCount * 3);

      for (let i = 0; i < starsCount * 3; i++) {
        starPos[i] = (Math.random() - 0.5) * 1500;
      }

      starsGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
      const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.9, transparent: true, opacity: 0.5 });
      const starField = new THREE.Points(starsGeo, starsMat);
      scene.add(starField);

      setTimeout(() => {
        const renderer = Graph.renderer();
        const camera = Graph.camera();

        const composer = new THREE.EffectComposer(renderer);
        const renderPass = new THREE.RenderPass(scene, camera);
        composer.addPass(renderPass);

        const bloomPass = new THREE.UnrealBloomPass(
          new THREE.Vector2(window.innerWidth, window.innerHeight),
          1.5, 0.4, 0.15
        );
        composer.addPass(bloomPass);

        function animate() {
          requestAnimationFrame(animate);
          animatedRings.forEach((r, idx) => {
            r.rotation.z += (idx % 2 === 0) ? 0.015 : -0.02;
          });
          composer.render();
        }
        animate();
      }, 500);
    }

    // --- AI SMART FLOW PARSER ENGINE ---
    function generateAIFlow() {
      const input = document.getElementById('promptInput').value.trim();
      if (!input) return alert('Pehle sentence ya system concept enter karein!');

      const nodesMap = new Map();
      const links = [];

      if (input.includes('->')) {
        const lines = input.split('\n');
        lines.forEach(line => {
          if (line.includes('->')) {
            const parts = line.split(/->|-->/).map(s => s.trim().toUpperCase());
            if (parts.length >= 2) {
              const src = parts[0];
              const tgt = parts[1];

              if (!nodesMap.has(src)) nodesMap.set(src, { id: src, name: src, desc: `Source Entity: ${src}`, val: 18 });
              if (!nodesMap.has(tgt)) nodesMap.set(tgt, { id: tgt, name: tgt, desc: `Target Entity: ${tgt}`, val: 12 });

              links.push({ source: src, target: tgt });
            }
          }
        });
      } else {
        const stopWords = new Set(['and', 'with', 'the', 'for', 'into', 'from', 'your', 'this', 'that', 'using', 'then']);
        const words = input.replace(/[^\w\s]/gi, '').split(/\s+/).filter(w => w.length > 2 && !stopWords.has(w.toLowerCase()));

        if (words.length > 0) {
          const rootKey = words[0].toUpperCase() + '_CORE';
          nodesMap.set(rootKey, { 
            id: rootKey, 
            name: rootKey, 
            desc: `Primary Flow Anchor: ${input}`, 
            val: 30,
            isRoot: true 
          });

          let prevId = rootKey;

          words.slice(1).forEach((word, idx) => {
            const nodeKey = word.toUpperCase();
            if (!nodesMap.has(nodeKey)) {
              nodesMap.set(nodeKey, { 
                id: nodeKey, 
                name: nodeKey, 
                desc: `AI Derived Concept #${idx + 1}: ${word}`, 
                val: Math.max(10, 22 - idx * 2) 
              });

              links.push({ source: prevId, target: nodeKey });

              if (idx % 2 === 0) {
                links.push({ source: rootKey, target: nodeKey });
              }

              prevId = nodeKey;
            }
          });
        }
      }

      if (Graph) {
        Graph.graphData({ nodes: Array.from(nodesMap.values()), links });
        setTimeout(() => Graph.zoomToFit(1000, 50), 300);
      }
    }

    // --- WEB SPEECH VOICE CONTROL ENGINE ---
    let recognition;
    let isListening = false;

    function toggleVoiceControl() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Aapka browser Speech Recognition support nahi karta. Chrome browser use karein.");
        return;
      }

      const micText = document.getElementById('micText');
      const micDot = document.getElementById('micDot');
      const voiceStatus = document.getElementById('voiceStatus');

      if (!isListening) {
        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = false;
        recognition.lang = 'en-US';

        recognition.onstart = () => {
          isListening = true;
          micText.innerText = "LISTENING VOICE...";
          micDot.className = "w-2 h-2 rounded-full bg-red-500 animate-ping";
          voiceStatus.innerText = "MIC_ACTIVE";
          playBeep(900, 0.1);
        };

        recognition.onresult = (event) => {
          const transcript = event.results[event.results.length - 1][0].transcript.trim().toLowerCase();
          console.log("Voice Command Recognized:", transcript);
          
          playBeep(1100, 0.05);

          if (transcript.includes("reset") || transcript.includes("clear")) {
            resetCamera();
          } else if (transcript.includes("render") || transcript.includes("generate")) {
            generateAIFlow();
            playWarpSound();
          } else if (transcript.includes("zoom core") || transcript.includes("focus core")) {
            const coreNode = Graph.graphData().nodes.find(n => n.id.includes("CORE"));
            if (coreNode) {
              Graph.cameraPosition({ x: coreNode.x * 2, y: coreNode.y * 2, z: coreNode.z * 2 }, coreNode, 1000);
            }
          } else {
            document.getElementById('promptInput').value = transcript;
            generateAIFlow();
            playWarpSound();
          }
        };

        recognition.onerror = () => stopVoice();
        recognition.onend = () => { if (isListening) recognition.start(); };

        recognition.start();
      } else {
        stopVoice();
      }
    }

    function stopVoice() {
      isListening = false;
      if (recognition) recognition.stop();
      document.getElementById('micText').innerText = "START VOICE COMMANDS";
      document.getElementById('micDot').className = "w-2 h-2 rounded-full bg-white";
      document.getElementById('voiceStatus').innerText = "MIC_READY";
      playBeep(400, 0.1);
    }

    function resetCamera() {
      if (Graph) Graph.zoomToFit(1000, 50);
    }

    function closeDetails() {
      document.getElementById('nodeDetails').classList.add('hidden');
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', startEngine);
    } else {
      startEngine();
    }
  </script>
</body>
</html>
